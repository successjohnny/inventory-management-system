<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Product</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

    <div class="container">

        <h1>Edit Product</h1>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form
            action="/edit-product/{{ product.id }}"
            method="post"
            class="product-form"
        >

            <div class="form-group">

                <label for="name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ product.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="price">
                    Price
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    value="{{ product.price }}"
                    min="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="low_stock_level">
                    Low Stock Level
                </label>

                <input
                    type="number"
                    id="low_stock_level"
                    name="low_stock_level"
                    value="{{ product.low_stock_level }}"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    name="category"
                    value="{{ product.category }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="supplier">
                    Supplier
                </label>

                <input
                    type="text"
                    id="supplier"
                    name="supplier"
                    value="{{ product.supplier or '' }}"
                    placeholder="e.g. ABC Electronics"
                >

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Update Product
                </button>

                <a
                    href="/"
                    class="btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>


        <hr>


        <h2>Stock Movement</h2>

        <form
            action="/stock-movement/{{ product.id }}"
            method="post"
            class="product-form"
        >

            <div class="form-group">

                <label for="movement_type">
                    Movement Type
                </label>

                <select
                    id="movement_type"
                    name="movement_type"
                    required
                >

                    <option value="IN">
                        Stock In
                    </option>

                    <option value="OUT">
                        Stock Out
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="quantity">
                    Quantity
                </label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="note">
                    Note
                </label>

                <input
                    type="text"
                    id="note"
                    name="note"
                    placeholder="e.g. New delivery"
                >

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Record Movement
                </button>

            </div>

        </form>


        <div class="product-information">

            <h2>Current Stock</h2>

            <p>
                <strong>Product:</strong>
                {{ product.name }}
            </p>

            <p>
                <strong>Current Quantity:</strong>
                {{ product.quantity }}
            </p>

            <p>
                <strong>Low Stock Level:</strong>
                {{ product.low_stock_level }}
            </p>

        </div>

    </div>

</body>
</html>
