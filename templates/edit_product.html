<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>

<body>

    <header>
        <h1>Edit Product</h1>
        <p>Update product information</p>
    </header>

    <main>

        <section class="form-container">

            <h2>Edit {{ product.name }}</h2>

            <form action="/edit-product/{{ product.id }}" method="post">

                <label for="name">Product Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ product.name }}"
                    required
                >


                <label for="price">Price</label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    value="{{ product.price }}"
                    min="0"
                    required
                >


                <label for="quantity">Quantity</label>

                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    value="{{ product.quantity }}"
                    min="0"
                    required
                >


                <label for="low_stock_level">
                    Low Stock Level
                </label>

                <input
                    type="number"
                    id="low_stock_level"
                    name="low_stock_level"
                    value="{{ product.low_stock_level }}"
                    min="0"
                    required
                >


                <label for="category">Category</label>

                <input
                    type="text"
                    id="category"
                    name="category"
                    value="{{ product.category }}"
                    required
                >


                <button type="submit">
                    Save Changes
                </button>

            </form>

            <br>

            <a href="/" class="back-button">
                Back to Inventory
            </a>

        </section>

    </main>

</body>
</html>
