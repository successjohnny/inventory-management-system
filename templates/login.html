<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administrator Login | Inventory Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 26px;
        }

        .subtitle {
            margin-bottom: 30px;
            text-align: center;
            color: #94a3b8;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 6px;
            background: #0f172a;
            color: #ffffff;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #38bdf8;
            outline-offset: 1px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #0284c7;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .error {
            padding: 12px;
            border: 1px solid #ef4444;
            border-radius: 6px;
            background: #450a0a;
            color: #fecaca;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>Inventory Management</h1>

        <p class="subtitle">
            Administrator Login
        </p>

        {% if error %}
            <div class="error" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="post">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
                autofocus
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Log In
            </button>
        </form>
    </main>
</body>
</html>
